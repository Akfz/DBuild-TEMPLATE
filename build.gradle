buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath "org.spongepowered:mixingradle:${project.mixingradle_version}"
    }
}

plugins {
    id 'java'
    id 'io.github.Akfz.dbg' version '1.0.0'

    id 'fabric-loom'               apply false
    id 'net.minecraftforge.gradle' apply false
    id 'net.neoforged.moddev'      apply false
    id 'org.parchmentmc.librarian.forgegradle' apply false
}

def javaVer = Integer.parseInt(project.findProperty('java_version') ?: '17')
java {
    sourceCompatibility = JavaVersion.toVersion(javaVer)
    targetCompatibility = JavaVersion.toVersion(javaVer)
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVer)
    }
}

version = project.mod_version
group = project.maven_group

repositories {
    if (project.hasProperty('aslib_version') && project.aslib_version) {
        maven { url = 'https://raw.githubusercontent.com/Akfz/AsLib/maven/' }
    }
    if (project.hasProperty('dbuild_version') && project.dbuild_version) {
        maven { url = 'https://raw.githubusercontent.com/Akfz/DBuild/maven/' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release  = Integer.parseInt(project.findProperty('java_version') ?: '17')
}

sourceSets {
    main {
        java.srcDirs      = ['src/generated/java']
        resources.srcDirs = ['src/generated/resources']
    }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

dbuild {
    defaultLoader = 'fabric' //also replaces classpath, userfull for check mappings

    //HELPERS
    useLoaderSourceSet() // instead src/main/java using src/main/<loader> (like src/main/fabric, src/main/forge)
    filterForeignMetadata() // clean resources per loader (in fabric will not appear forge.toml)
    dbuildannotations() // turn on dbuild annotation logic (dont need to generate initializer)

    registryCommand 'runClient', 'fabric', 'forge' //registers wrappers for both loaders fabricRunClient and forgeRunClient

    fabric {
        devJar() // unobfuscated dev jar
        obfJar() // production (obfuscated) jar

        configure {
            apply plugin: 'fabric-loom'

            base {
                archivesName = "${project.archives_base_name}-fabric"
            }

            repositories {
                mavenCentral()
                maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
            }

            dependencies {
                minecraft "com.mojang:minecraft:${project.minecraft_version}"

                mappings loom.layered() { // recommend to forge-fabric common code
                     officialMojangMappings()
                     def pMc = project.findProperty('parchment_mc_version') ?: project.minecraft_version
                     def pVer = project.findProperty('parchment_version') ?: ''
                     if (pVer) {
                        parchment("org.parchmentmc.data:parchment-${pMc}:${pVer}@zip")
                     }
                }
                modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

                if (project.hasProperty('aslib_version') && project.aslib_version) {
                    def aslibDep = "v.akfz:aslib-forge:${project.aslib_version}"
                    implementation aslibDep
                    annotationProcessor aslibDep
                }
                if (project.hasProperty('dbuild_version') && project.dbuild_version) {
                    def dbuildDep = "v.akfz:DBuild:${project.dbuild_version}"
                    compileOnly dbuildDep
                    annotationProcessor dbuildDep
                }

                def mixinExtrasVer = project.findProperty('mixinextras_version') ?: '0.4.1'
                modCompileOnly "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"
                annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"
            }

            loom {
                mixin {
                    useLegacyMixinAp = true
                    defaultRefmapName = "${project.findProperty('mixinfile') ?: project.mod_id}.refmap.json"
                }

                runs {
                    client {
                        client()
                        runDir 'fabricRun'
                    }
                    server {
                        server()
                        runDir 'fabricRunServer'
                    }
                }
            }

            //need for dbuild
            tasks.withType(JavaCompile).configureEach {
                options.compilerArgs << "-AmodLoaderTarget=fabric"
            }

            tasks.named('remapJar').configure {
                from { configurations.embed.collect { it.isDirectory() ? it : zipTree(it) } }
            }

            tasks.named('processResources', ProcessResources).configure {
                def props = [
                    mod_id        : project.mod_id,
                    mod_name      : project.mod_id,
                    mod_version   : project.mod_version,
                    mod_authors   : project.findProperty('mod_authors') ?: '',
                    mod_license   : project.findProperty('mod_license') ?: 'MIT',
                    mod_description: project.findProperty('mod_description') ?: '',
                    maven_group   : project.maven_group,
                    archives_base_name: project.archives_base_name,
                    version       : project.mod_version
                ]
                inputs.properties(props)
                filesMatching('**/*.json') { expand(props) }
                duplicatesStrategy = DuplicatesStrategy.INCLUDE
            }
        }
    }
    forge {
        devJar()
        obfJar()
        registryCommand 'runClient', 'runServer', 'build'

        configure {
            apply plugin: 'net.minecraftforge.gradle'
            apply plugin: 'org.spongepowered.mixin'
            apply plugin: 'org.parchmentmc.librarian.forgegradle'

            minecraft {
                mappings channel: 'parchment', version: "${parchment_version}-${parchment_mc_version}"

                runs {
                    configureEach {
                        workingDirectory project.file('run')
                        property 'forge.logging.markers', 'REGISTRIES'
                        property 'forge.logging.console.level', 'debug'
                        property 'forge.earlydisplay.enable', 'false'

                        mods {
                            "${project.mod_id}" {
                                source sourceSets.main
                            }
                        }
                    }

                    def mixinConfigName = project.findProperty('mixinfile') ?: project.mod_id
                    client { property 'mixin.config', "${mixinConfigName}.json" }
                    server { property 'mixin.config', "${mixinConfigName}.json" }
                }
            }

            dependencies {
                minecraft "net.minecraftforge:forge:${project.forge_version}"
                annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"

                if (project.hasProperty('aslib_version') && project.aslib_version) {
                    def aslibDep = "v.akfz:aslib-forge:${project.aslib_version}"
                    implementation aslibDep
                    annotationProcessor aslibDep
                }
                if (project.hasProperty('dbuild_version') && project.dbuild_version) {
                    def dbuildDep = "v.akfz:DBuild:${project.dbuild_version}"
                    compileOnly dbuildDep
                    annotationProcessor dbuildDep
                }

                def mixinExtrasVer = project.findProperty('mixinextras_version') ?: '0.4.1'
                embed "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"
                annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"
            }

            mixin {
                def mixinConfigName = project.findProperty('mixinfile') ?: project.mod_id
                add sourceSets.main, "${mixinConfigName}.refmap.json"
                config "${mixinConfigName}.json"
            }

            tasks.withType(Jar).configureEach {
                def mixinConfigName = project.findProperty('mixinfile') ?: project.mod_id
                manifest {
                    attributes 'MixinConfigs': "${mixinConfigName}.json"
                }
            }

            tasks.withType(JavaCompile).configureEach {
                options.compilerArgs << "-AmodLoaderTarget=forge"
            }
        }
    }
    
}